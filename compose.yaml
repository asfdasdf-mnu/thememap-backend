# Development only. Database is not exposed to host/public networks.
services:
  api:
    build: .
    volumes:
      - .:/workspace
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://thememap:local-dev-only@db:5432/thememap
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: thememap
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: thememap
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thememap -d thememap"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
